name: CarGame

on: [push,workflow_dispatch]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install CMake 4
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.0'

      # ---- Enable MSVC toolchain on Windows ----
      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # ---- Setup vcpkg ----
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 2ad7bd06128280e02bfe02361d8ffd7d465cfcf0

      # ---- Install Linux-only dependencies ----
      - name: Linux extra dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # these where suggested by AI
          sudo apt-get update && sudo apt-get install -y \
            libxinerama-dev \
            libxcursor-dev \
            xorg-dev \
            libglu1-mesa-dev \
            pkg-config \
            libglfw3 \
            libglfw3-dev

      # ---- Configure CMake using vcpkg toolchain ----
      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          .

      # ---- Build ----
      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- Run tests ----
      - name: Run tests
        run: |
          cd build/tests
          ctest --output-on-failure --parallel
